<!DOCTYPE html>
<html lang="en">

<head>

  <link href="./styles.css" rel="stylesheet" />
</head>

<body>
  <div class="business-card">
    <img class="profile-image"

    />

    <p>example@gmail.com</p>

    Portfolio
