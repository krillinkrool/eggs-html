<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="styles.css" rel="stylesheet"/>
    <title>Gift for you</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&family=Libre+Franklin:ital@0;1&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main_container">
        <main>
            <div id="birthday_title" class="div-happy-birthday"><h1 class="dynapuff-happy-birthday yellow">H</h1><h1 class="dynapuff-happy-birthday blue">A</h1><h1 class="dynapuff-happy-birthday pink"
            >P</h1><h1 class="dynapuff-happy-birthday orange">P</h1><h1 class="dynapuff-happy-birthday green">Y </h1>
            <h1 class="dynapuff-happy-birthday blue">B</h1><h1 class="dynapuff-happy-birthday yellow">I</h1><h1 class="dynapuff-happy-birthday pink"
            >R</h1><h1 class="dynapuff-happy-birthday orange">T</h1><h1 class="dynapuff-happy-birthday yellow">H</h1><h1 class="dynapuff-happy-birthday green"
            >D</h1><h1 class="dynapuff-happy-birthday orange">A</h1><h1 class="dynapuff-happy-birthday yellow">Y</h1>
            <div><h1 class="dynapuff-happy-birthday blue">M</h1><h1 class="dynapuff-happy-birthday pink">I</h1><h1 class="dynapuff-happy-birthday orange">E</h1
            ><h1 class="dynapuff-happy-birthday blue">!</h1><h1 class="dynapuff-happy-birthday pink"
            >!</h1><h1 class="dynapuff-happy-birthday green">!</h1></div></div>
            <figure>
            <figcaption>Click for sound:</figcaption>
            <audio controls autoplay class="background_music" id="bgm_track" src="./assets/sounds/happy-happy-happy-song.mp3"></audio>
            <audio autoplay class="audio_class" id="audio1"  src="./assets/sounds/yippie.mp3"></audio>
            <audio class="audio_class" id="audio2"  src="./assets/sounds/yippie.mp3"></audio>
            <audio class="audio_class" id="audio3"  src="./assets/sounds/yippie.mp3"></audio>
            <audio></audio>
            </figure>
            <div id="changing_container">
                <!-- Happpy Birthday H1 Text -->
                 <!-- PARTY PALLETE (COLORS) -->
                <!-- #ffe47d yellow
                #d47e3e orange
                #d5a9b9 pink
                #85b1bd blue
                #9ebe96 green
                #ffffff white -->



                <p class="work-sans card-title">Hello bb, gifto for u</p>
                <img class="present_boy_img" src="./assets/images/present_boy.png" alt="Boy holding present"/>
                <button id="birthday_button">Press</button>
            </div>
        </main>
    </div>  

    <!-- <script src="script.js"> -->
    <script>
        //Main Message
        document.querySelectorAll(".audio_class").forEach((audio, index) => {
            setTimeout(() => {
                audio.volume = 0.3;
                audio.play();
            }, index * 500);
        })
        const soundEffect1 = document.getElementById("audio1");
        const soundEffect2 = document.getElementById("audio2");
        const soundEffect3 = document.getElementById("audio3");
        const background_music = document.getElementById("bgm_track");
        soundEffect1.volume = 0.3;
        soundEffect2.volume = 0.3;
        soundEffect3.volume = 0.3;
        background_music.volume = 0.1;
        
        const messages = [
                    "Happy Birthday bb!!! Actually si past dale ja, nagsulat ako at 3am, hahahaaa. Happy birthday bb, ",
                    "tlad dun ang once in every year day mo, the day of borning(?) charr. ",
                    "Okay, so, um, lipat ko kung ano I-say ko, so, wait, um, I-dumdumon ko any liwan.\n\n Hahaa, Joking aside. ",
                    "(Si present dale dun ja) ",
                    "I'm happy it's your birthday bb. huhu wra pa ko like matao knimo this year ",
                    "(I’m hoping next year mwaybe?😭). \n\nPy, um, I wanna say something though and that is nga, ",
                    "very emo (\"ambot sa emo dale\" so prepare your best cringe expression (if u r cringing). ",
                    "Thank you for coming to my life bb, last year. And I know wra pa kita kakitaay huhu py, ",
                    "I really want to be able to meet you gd, and you know, whatever happens magkitaay ta😭, I'll ",
                    "accept your decision😭, (\"may putok kw dale block tkaw\") charrr ",
                    "(ma deodorant aku). I really, reallly, really thank you. If it wasn't for you bb, bsi ",
                    "ultra depression ako gd. Charr, py seriously, thank you gd sa imo cheekiness. ",
                    "Sa imo humor, sa imo kind words knakon. I really feel loved kg happy whenever mag chat kita. \n\n",
                    "Thank you bb for giving me your time and energy, and ang iyong sabado, (para bang para bang). ",
                    "I have never connected to someone like this before and its driving me crazy, im crazy for youuu. ",
                    "I love you bb and thank you gd for everything, ur arrival in my life is the greatest christmas gift I could ever have, and I'm really grateful to u and ky lord",
                    "Happy birthday Elemie Magalay, I wish you success gd sa board exam, magiging RN ka sa 2027 lets gooooooo",
                    "(I hope wra tkaw na give ka aneurysm sa akon writing skills)"
                ];
        const birthday_message = messages.join("");
        const changing_container_HTML = [
                                    '<audio autoplay class="background_music" id="bgm_track" src="./assets/sounds/unknown.m4a"></audio>',
                                    '<img class="img-girl" src="./assets/images/birthday_girl.png" />',
                                    '<img class="img-girl" src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExZHg5ZnNzcmQxb2swcG1mdjluOW9xaGRxanhmZjI2aG9tazducjJ2byZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/QXppKCmid0gY8ETOdO/giphy.gif" alt="penguin wishing happy birthday"/>',
                                    '<p id="birthday_message"></p>'];

        const changing_container = document.querySelector("#changing_container");
        
        //Emojis
        const birthdayEmojis = ["🎉", "🎈", "🎁", "✨"];

        function swapContent(html, afterSwap){
            changing_container.classList.add("fade-out");
            setTimeout(() => {
                changing_container.innerHTML = html;
                changing_container.classList.remove("fade-out");
                if (afterSwap) afterSwap();
            }, 500);
        }

        function showTease() {
            const swapContentMsgs = [
                        '<img class="img-contained" src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExOGFuOTJqcmMwMWczaXBhYWt6aWRxNTJvbWo0cTM3aDA5cDBhbzRncyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/XoS1xoQhgxRjGJbnoP/giphy.gif" alt="penguin wishing happy birthday"/>',
                        ' <p class="work-sans card-title">Waits lng bb ga loading pa, ok ja dun 👀</p>',
                        '<button id="reveal_button">Press</button>'];
            swapContent(swapContentMsgs.join(""), () => {
                document.getElementById("reveal_button").addEventListener("click", () => {
                    setTimeout(showTease2, 1000);
                })
            });
        }

        function showTease2() {
            const swapContentMsgs = [' <p class="work-sans card-title">Ay wait di pa ready, ma cr ko any, charr ja hu 👀</p>',
                        '<img class="img-contained" src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExZTAxMjI2eGNmZzA3cjR3c2k4NnNmeXV6djU4NTV2djVrb2w5ZzJlcyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/oGTBD3l3pK1aDaG9pu/giphy.gif" alt="penguin wishing happy birthday"/>',
                        '<button id="reveal_button_alt">Press to punch dale</button>',
                        '<button id="reveal_button">or not</button>',
                    ];
            swapContent(swapContentMsgs.join(""), () => {
                document.getElementById("reveal_button").addEventListener("click", () => {
                    setTimeout(showMessage, 1000);
                })
                document.getElementById("reveal_button_alt").addEventListener("click", () => {
                    setTimeout(showMessageAlt, 1000);
                })
            });
        }

        function showMessage() {
            swapContent(changing_container_HTML.join(""), () => {
                const typing_message = document.getElementById("birthday_message");
                let message_character = 0;
                const timer = setInterval(() => {
                    typing_message.textContent += birthday_message[message_character];
                    message_character++;
                    if (message_character >= birthday_message.length) clearInterval(timer);
                    }, 5);
                });
        }

        function showMessageAlt() {
            const changing_container_HTML = [
                                    '<audio autoplay class="background_music" id="bgm_track" src="./assets/sounds/unknown.m4a"></audio>',
                                    '<img class="img-punched" src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExd3A4YjhseG56amFzMXdmYTI0YmdyOWdtcDN0NTg1a2p1eDZtNjdsaSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/te8J1t6B53nMwTFYSC/giphy.gif" alt="penguin wishing happy birthday"/>',    
                                    '<img class="img-girl" src="./assets/images/birthday_girl.png" />',
                                    '<img class="img-girl" src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExZHg5ZnNzcmQxb2swcG1mdjluOW9xaGRxanhmZjI2aG9tazducjJ2byZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/QXppKCmid0gY8ETOdO/giphy.gif" alt="penguin wishing happy birthday"/>',
                                    '<p id="birthday_message"></p>'];
            swapContent(changing_container_HTML.join(""), () => {
                const typing_message = document.getElementById("birthday_message");
                let message_character = 0;
                const timer = setInterval(() => {
                    typing_message.textContent += birthday_message[message_character];
                    message_character++;
                    if (message_character >= birthday_message.length) clearInterval(timer);
                    }, 5);
                });
        }

        function spawnEmojis() {
            for (let numberOfEmojis = 0; numberOfEmojis < 25; numberOfEmojis++ )
            {
                const spanEmojis = document.createElement("span");
                spanEmojis.className = "birthday_emojis";
                spanEmojis.textContent = birthdayEmojis[Math.floor(Math.random() * birthdayEmojis.length)];
                spanEmojis.style.left = Math.random() * 100 + "vw"; //randomm colummn
                spanEmojis.style.fontSize = 16 + Math.random() * 24 + "px"; // random size
                spanEmojis.style.animationDuration = 6 + Math.random() * 8 + "s"; // random speed
                spanEmojis.style.animationDelay = -Math.random() * 10 + "s";
                document.body.appendChild(spanEmojis);
            }

            // document.getElementById("birthday_title").addEventListener("click", () => {
            //     birthday_title = document.querySelector("birthday_title");
            //     birthday_title.classList.add();
            // });
            }

        function explode(explodingEmoji) {
            const rect = explodingEmoji.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height /2;

            for (let emojiIndex = 0; emojiIndex < 12; emojiIndex++) {
                const emojiPiece = document.createElement("span");
                emojiPiece.className = "burst";
                emojiPiece.textContent = "✨";
                emojiPiece.style.left = x + "px";
                emojiPiece.style.top = y + "px";
                document.body.appendChild(emojiPiece);
                
                const randomAngle = Math.random() * Math.PI * 2;
                const randomDistance = 40 + Math.random() * 80;
                const dx = Math.cos(randomAngle) * randomDistance;
                const dy = Math.sin(randomAngle) * randomDistance;

                emojiPiece.animate([
                    {transform: "translate(-50%, -50%) scale(1)", opacity: 1},
                    {transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0.2)`, opacity: 0}]
                , {duration: 500 + Math.random() * 400, easing: "ease-out"})
                .onfinish = () => emojiPiece.remove();
            }

            explodingEmoji.remove();
        }

        spawnEmojis();
        document.getElementById("birthday_button").addEventListener("click", () => {
            setTimeout(showTease, 1000);
        });
        document.addEventListener("click", (e) => {
            const emoji = e.target.closest(".birthday_emojis");
            if (emoji) explode(emoji);
        });

    </script>
