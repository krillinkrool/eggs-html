<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HTML Audio and Video Lab</title>
  <link rel="stylesheet" href="./audio-video.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,100..900;1,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body class="libre-franklin">
  <section>
    <h1>Audio and Video laboratory</h1>
    <p>Helo welcome to vedeo</p>
    <h2>Her is vedeo</h2>
    <h3>Ignore this one</h3>
    <video width="360" muted loop controls poster="https://th.bing.com/th/id/OIP.aW82GsBwedSFwsOxVV5rXgHaEK?w=276&h=180&c=7&r=0&o=7&pid=1.7&rm=3">
      <source
        src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4"
        type="video/mp4">
    </video>
    <iframe width="360" height="360" src="https://www.youtube.com/embed/_uN2aPIdVYI?si=mVQ7qRuLkZiCoRYq" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </section>
  <section>
    <h2>Song: </h2>
    <audio src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3" controls loop></audio>
    <h2>Sway Cover by Beabadoobee</h2>
    <iframe width="360" height="360" src="https://www.youtube.com/embed/rZHBxReQd8s?si=CKTPsG2KSGMrNHZB" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </section>
  
</body>
</html>
